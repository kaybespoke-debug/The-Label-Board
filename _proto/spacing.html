<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero spacing · pick a number</title>
<style>
  :root{--ink:#e8eaf0;--dim:#98a2b3;--gold:#e0aa3f;--line:#223149;--panel:#0d1725}
  *{box-sizing:border-box}
  body{margin:0;background:#06101d;color:var(--ink);
    font:14px/1.5 'Inter','Segoe UI',system-ui,sans-serif}
  .bar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
    padding:14px 18px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .ctl{display:flex;flex-direction:column;gap:5px;min-width:230px}
  .ctl label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .ctl .v{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--gold)}
  select{background:#111c2b;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
  .out{margin-left:auto;font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim);
    background:#111c2b;border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre}
  .out b{color:var(--gold)}
  .note{padding:10px 18px;font-size:12.5px;color:var(--dim);border-bottom:1px solid var(--line)}
  .stage{padding:18px;display:flex;justify-content:center}
  iframe{border:1px solid var(--line);border-radius:10px;background:#06101d;height:760px}
</style>
</head>
<body>

<div class="bar">
  <div class="ctl">
    <label>Headline to buttons <span class="v" id="vA">88</span>px</label>
    <input id="a" type="range" min="0" max="200" value="88">
  </div>
  <div class="ctl">
    <label>Buttons to waitlist row <span class="v" id="vB">46</span>px</label>
    <input id="b" type="range" min="0" max="140" value="46">
  </div>
  <div class="ctl" style="min-width:170px">
    <label>Screen width</label>
    <select id="w">
      <option value="390">390 — phone</option>
      <option value="768">768 — tablet</option>
      <option value="1280" selected>1280 — laptop</option>
      <option value="1680">1680 — wide</option>
    </select>
  </div>
  <div class="out" id="out"></div>
</div>

<p class="note">
  Drag until it looks right, then tell me the two numbers in the box on the right.
  This page is a tool, it is not on the site, and nothing here is saved.
</p>

<div class="stage"><iframe id="f" src="../web/index.html" width="1280"></iframe></div>

<script>
var a = document.getElementById('a'), b = document.getElementById('b'),
    w = document.getElementById('w'), f = document.getElementById('f'),
    vA = document.getElementById('vA'), vB = document.getElementById('vB'),
    out = document.getElementById('out');

/* Same origin, because this page and the site are served from the same root,
   so the stylesheet can be written straight into the frame. */
function apply() {
  vA.textContent = a.value;
  vB.textContent = b.value;
  out.textContent = '.hero .btn-row{margin-top:' + a.value + 'px}\n'
                  + '.hero .opens-row{margin-top:' + b.value + 'px}';
  var doc = f.contentDocument;
  if (!doc) return;
  var tag = doc.getElementById('__spacing');
  if (!tag) {
    tag = doc.createElement('style');
    tag.id = '__spacing';
    doc.head.appendChild(tag);
  }
  tag.textContent = '.hero .btn-row{margin-top:' + a.value + 'px !important}'
                  + '.hero .opens-row{margin-top:' + b.value + 'px !important}';
}
a.addEventListener('input', apply);
b.addEventListener('input', apply);
w.addEventListener('change', function () { f.width = w.value; });
f.addEventListener('load', apply);
apply();
</script>
</body>
</html>
