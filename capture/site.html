<!DOCTYPE html>
<!-- Looks at a website page at a real phone width.

     Chrome's --window-size does not reliably set the layout viewport in this
     build: the page lays out wide and the screenshot simply crops it, which
     reads as horizontal overflow that is not there. An iframe does get a real
     viewport of its own width, so this is what the phone checks go through.

     capture/site.html?p=index&w=390&h=844                                  -->
<meta charset="utf-8">
<title>site capture</title>
<style>html,body{margin:0;background:#06101d}iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search);
var w = parseInt(q.get('w') || '390', 10);
var h = parseInt(q.get('h') || '844', 10);
var page = (q.get('p') || 'index').replace(/[^a-z0-9-]/gi, '');
var f = document.getElementById('f');
f.style.width = w + 'px';
f.style.height = h + 'px';
f.onload = function () {
  var d = f.contentDocument;
  var st = d.createElement('style');
  st.textContent = '*,*::before,*::after{animation:none !important;transition:none !important}';
  d.head.appendChild(st);
  setTimeout(function () {
    /* report the truth about width in the title, so a dump can read it */
    document.title = 'ready:' + page + ':vw' + d.documentElement.clientWidth +
      ':scroll' + d.documentElement.scrollWidth +
      ':height' + d.documentElement.scrollHeight;
  }, 900);
};
f.src = 'http://localhost:3003/' + page + '.html';
</script>
