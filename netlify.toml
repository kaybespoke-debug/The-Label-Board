# ============================================================================
# ADMIN DEPLOYMENT BRANCH — admin-deploy
#
# Netlify publishes the admin/ folder for the Admin Control Centre.
# Connected to github.com/kaybespoke-debug/The-Label-Board, branch admin-deploy.
#
# ---------------------------------------------------------------------------
# THIS FILE IS DELIBERATELY DIFFERENT ON main. DO NOT LET A MERGE OVERWRITE IT.
#
# On main it reads publish = "site" and serves the customer app. If a merge
# brings this version across, the customer app's Netlify site starts serving
# the admin console to every studio on the platform. It is not a conflict git
# will warn you about, because main is an ancestor of this branch and the
# merge fast-forwards cleanly.
#
# Merging admin-deploy into main, safely:
#
#     git checkout main
#     git merge --no-ff --no-commit admin-deploy
#     git checkout HEAD -- netlify.toml      # keep main's own publish path
#     git commit
#
# The permanent fix is to set each site's publish directory in the Netlify
# dashboard instead of here, and delete this file. That is a settings change
# on four live sites, so it is Kayode's to make, not something to slip into
# a commit.
# ============================================================================

[build]
  publish = "admin"

# ---------------------------------------------------------------------------
# STAGING SITE — the-label-board-staging.netlify.app, branch
# phase-1b-team-invitations. Dormant backup, not the thing doing the work.
#
# That site is configured in the Netlify dashboard with a BASE DIRECTORY of
# "site", so Netlify reads site/netlify.toml and never opens this file at all.
# You can see it from outside: https://the-label-board-staging.netlify.app/
# serves the app at "/", and the rule that rewrites "/" to
# "/layi_dashboard.html" exists only in site/netlify.toml.
#
# The block below matters if that setting is ever cleared. This branch was cut
# from admin-deploy, so it inherits publish = "admin" above, and a staging site
# reading this file without it would serve the Admin Control Centre to a
# tester expecting the customer app — which is exactly what it did on its
# first deploy. A named-branch context only ever matches a deploy of that one
# branch, so main and admin-deploy cannot be touched by it, and [build] is
# left alone rather than edited, which would have handed the admin console's
# own site the customer app.
# ---------------------------------------------------------------------------

[context."phase-1b-team-invitations"]
  publish = "site"
