<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<meta name="color-scheme" content="dark light">
<title>The Label Board — Admin Control Centre</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Source+Serif+4:wght@400;500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ================= SVG icon sprite ================= -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-home"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></g>
    <g id="i-users"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6"/><path d="M17.5 14.2A6.5 6.5 0 0 1 21.5 20"/></g>
    <g id="i-arrow-up"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></g>
    <g id="i-card"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/><path d="M6 14.5h4"/></g>
    <g id="i-receipt"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6"/><path d="M9 12h6"/></g>
    <g id="i-wallet"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M17 12.5h1.5"/><path d="M2.5 10h19"/></g>
    <g id="i-chart"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/></g>
    <g id="i-chat"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-4.5A8 8 0 0 1 13 4a8 8 0 0 1 8 8z"/><path d="M9 11h8"/><path d="M9 14.5h5"/></g>
    <g id="i-star"><path d="M12 3.5l2.6 5.5 6 .8-4.4 4.2 1.1 6L12 17.2 6.7 20l1.1-6L3.4 9.8l6-.8z"/></g>
    <g id="i-megaphone"><path d="M3 11v3l11 5V6z"/><path d="M14 8.5h3a3.5 3.5 0 0 1 0 7h-3"/><path d="M7 15v4"/></g>
    <g id="i-heart"><path d="M12 20s-7.5-4.6-7.5-9.8A4.2 4.2 0 0 1 12 7.5a4.2 4.2 0 0 1 7.5 2.7C19.5 15.4 12 20 12 20z"/></g>
    <g id="i-check"><path d="M4 12.5 9 17.5 20 6.5"/></g>
    <g id="i-shield"><path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></g>
    <g id="i-list"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/></g>
    <g id="i-gear"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></g>
    <g id="i-bell"><path d="M18 15V10a6 6 0 1 0-12 0v5l-1.5 2.5h15z"/><path d="M9.5 20.5a2.6 2.6 0 0 0 5 0"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></g>
    <g id="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></g>
    <g id="i-moon"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></g>
  </defs>
</svg>

<div class="shell">
  <!-- ================= sidebar ================= -->
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-label="The Label Board">
        <rect width="100" height="100" rx="24" fill="#0b1023"/>
        <path d="M33 27v33a10 10 0 0 0 10 10h16" stroke="#fff" stroke-width="5.5" fill="none" stroke-linecap="round"/>
        <path d="M43 35h13a8.5 8.5 0 0 1 0 17H43z" stroke="#fff" stroke-width="5.5" fill="none" stroke-linejoin="round"/>
        <path d="M43 52h15a9 9 0 0 1 0 18H43" stroke="#fff" stroke-width="5.5" fill="none" stroke-linejoin="round"/>
        <circle cx="74" cy="62" r="6" fill="#e0a94a"/>
      </svg>
      <div>
        <div class="brand-name">THE LABEL BOARD</div>
        <div class="brand-sub">Admin Control Centre</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="me" onclick="openDetail('staff',1)">
        <div class="av">KO</div>
        <div><div class="me-n">Kayode Ojomo</div><div class="me-r">Super Admin</div></div>
      </div>
    </div>
  </aside>

  <!-- ================= main ================= -->
  <main class="main">
    <div class="top">
      <div>
        <h1 id="ttl">Dashboard</h1>
        <div class="top-sub" id="sub">Monitor your platform at a glance</div>
      </div>
      <div class="top-act">
        <input class="srch" id="srch" placeholder="Search subscribers, tickets, payments…" oninput="onSearch(this.value)">
        <button class="iconbtn" onclick="openAlerts()" title="Alerts" id="bellBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bell"/></svg>
          <span class="dot" id="bellDot">0</span>
        </button>
        <button class="iconbtn" onclick="toggleTheme()" title="Switch theme" id="themeBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-moon" id="themeIcon"/></svg>
        </button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()"></div>
<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/pages.js"></script>
<script src="js/pages2.js"></script>
<script src="js/detail.js"></script>
<script src="js/metrics.js"></script>
<script src="js/actions.js"></script>
<script src="js/staffforms.js"></script>
<script src="js/login.js"></script>
<script>
/* ============================================================
   app.js — nav, render loop, boot
   ============================================================ */
const NAV = [
  ['Platform', [
    ['dashboard', 'Dashboard', 'i-home', null]
  ]],
  ['Subscribers', [
    ['subscribers', 'Subscribers', 'i-users', () => DB.subscribers.length],
    ['onboarding', 'Onboarding', 'i-arrow-up', () => DB.onboarding.length]
  ]],
  ['Billing', [
    ['billing', 'Plans & Billing', 'i-card', null],
    ['payments', 'Payments', 'i-receipt', () => DB.payments.filter(p => p.status === 'failed' || p.status === 'overdue').length],
    ['payroll', 'Payroll', 'i-wallet', () => DB.payslips.filter(s => s.monthKey === DB.payrollRuns[0].monthKey && s.status === 'pending').length],
    ['revenue', 'Revenue', 'i-chart', null]
  ]],
  ['Engagement', [
    ['support', 'Support & Usage', 'i-chat', () => Q.openTickets().length + DB.feedback.filter(f => f.state === 'under review' || f.state === 'pending').length],
    ['announcements', 'Announcements', 'i-megaphone', () => DB.announcements.filter(a => a.state === 'scheduled').length]
  ]],
  ['Operations', [
    ['tasks', 'Tasks', 'i-check', () => DB.tasks.filter(t => !t.done && t.dueIn <= 0).length],
    ['staff', 'Staff & Roles', 'i-shield', null],
    ['activity', 'Activity Log', 'i-list', null],
    ['settings', 'Settings', 'i-gear', null]
  ]]
];

const TITLES = {
  dashboard: ['Dashboard', 'Monitor your platform at a glance'],
  subscribers: ['Subscribers', 'Every business using The Label Board'],
  onboarding: ['Onboarding', 'From signup to a live, paying account'],
  billing: ['Plans & Billing', 'Plans, pricing and the referral programme'],
  payments: ['Payments', 'Every subscription transaction'],
  payroll: ['Payroll', 'Salaries, deductions and payslips'],
  revenue: ['Revenue', 'Recurring revenue and SaaS performance'],
  support: ['Support & Usage', 'Tickets, what subscribers are asking for, and how the product is used'],
  announcements: ['Announcements', 'Tell subscribers what changed'],
  tasks: ['Tasks', 'Internal work, who owns it, when it is due'],
  staff: ['Staff & Roles', 'Your team, their pay, attendance and access'],
  activity: ['Activity Log', 'Who did what, when, and why'],
  settings: ['Settings', 'Accounts, roles and preferences']
};

function buildNav() {
  document.getElementById('nav').innerHTML = NAV.map(g =>
    '<div class="grp"><div class="grp-t">' + g[0] + '</div>' +
    g[1].map(n => {
      const c = n[3] ? n[3]() : 0;
      return '<button class="nav" data-p="' + n[0] + '" onclick="go(\'' + n[0] + '\')">' +
        '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#' + n[2] + '"/></svg></span>' +
        '<span class="tx">' + n[1] + '</span>' +
        (c ? '<span class="badge">' + c + '</span>' : '') + '</button>';
    }).join('') + '</div>').join('');
}

function render() {
  buildNav();
  const page = UI.detail ? null : UI.page;

  // nav highlight — a detail view keeps its parent page lit
  const lit = UI.detail ? UI.back : UI.page;
  document.querySelectorAll('.nav').forEach(b => b.classList.toggle('on', b.dataset.p === lit));

  // title
  if (UI.detail) {
    const t = TITLES[UI.back] || ['', ''];
    document.getElementById('ttl').textContent = t[0];
    document.getElementById('sub').textContent = t[1];
  } else {
    const t = TITLES[UI.page] || ['', ''];
    document.getElementById('ttl').textContent = t[0];
    document.getElementById('sub').textContent = t[1];
  }

  // body
  let html = '';
  try {
    if (UI.detail) {
      const fn = DETAIL[UI.detail.type];
      html = fn ? fn(UI.detail.id) : '<div class="pnl"><div class="empty">Nothing to show.</div></div>';
    } else {
      const fn = PAGES[UI.page];
      html = fn ? fn() : '<div class="pnl"><div class="empty">Page not built.</div></div>';
    }
  } catch (err) {
    html = '<div class="pnl"><div class="empty">Something went wrong rendering this page.<br><span class="note">' +
      esc(err.message) + '</span></div></div>';
    console.error(err);
  }
  document.getElementById('view').innerHTML = html;

  // theme icon
  const dark = !document.body.classList.contains('light');
  document.getElementById('themeIcon').setAttribute('href', dark ? '#i-moon' : '#i-sun');

  // bell
  const alertCount = Q.pastDue().length + Q.urgentTickets().length + DB.tasks.filter(t => !t.done && t.dueIn < 0).length;
  const dot = document.getElementById('bellDot');
  dot.textContent = alertCount;
  dot.style.display = alertCount ? 'grid' : 'none';

  // keep search box in sync
  const sb = document.getElementById('srch');
  if (sb.value !== UI.search) sb.value = UI.search;
}

let searchT;
function onSearch(v) {
  UI.search = v;
  clearTimeout(searchT);
  searchT = setTimeout(() => {
    if (UI.detail) { UI.detail = null; UI.page = 'subscribers'; }
    render();
  }, 250);
}

function openAlerts() {
  const pd = Q.pastDue(), urg = Q.urgentTickets(), late = DB.tasks.filter(t => !t.done && t.dueIn < 0);
  const trialEnding = Q.trial().filter(s => s.renewIn <= 3);
  const rows = []
    .concat(urg.map(t => ['Urgent ticket', t.title + ' — ' + t.subscriber, "openDetail('ticket'," + t.id + ")", 'red']))
    .concat(pd.map(s => ['Payment failed', s.name + ' — ' + money(s.mrr) + ' unpaid', "openDetail('sub'," + s.id + ")", 'red']))
    .concat(trialEnding.map(s => ['Trial ending', s.name + ' — ' + (s.renewIn <= 0 ? 'today' : s.renewIn + ' days left'), "openDetail('sub'," + s.id + ")", 'amber']))
    .concat(late.map(t => ['Task overdue', t.title + ' — ' + Math.abs(t.dueIn) + ' days late', "openDetail('task'," + t.id + ")", 'amber']));

  modal('Alerts', rows.length + ' thing' + (rows.length === 1 ? '' : 's') + ' needing attention',
    rows.length ? rows.map(r => '<div class="row klik" onclick="closeModal();' + r[2] + '">' +
      '<div><b>' + esc(r[0]) + '</b><small>' + esc(r[1]) + '</small></div>' +
      '<span class="pill ' + r[3] + '">' + (r[3] === 'red' ? 'Act now' : 'Soon') + '</span></div>').join('')
      : '<div class="empty">Nothing needs you right now.</div>',
    '<button class="btn" onclick="closeModal()">Close</button>');
}

/* boot */
(function boot() {
  if (localStorage.getItem('tlb_admin_theme') === 'light') document.body.classList.add('light');
  setPeriod('today');
  render();
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('srch').focus(); }
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
