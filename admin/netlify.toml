# Label Board Admin Dashboard — separate Netlify deployment
# PWA-enabled SaaS business admin dashboard

[build]
  publish = "."

# Security headers - prevent indexing and embedding
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cache-Control = "public, max-age=3600"

# PWA manifest - allow caching
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

# Service worker - no caching (always fresh)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "max-age=0, no-cache, no-store, must-revalidate"

# Dashboard HTML - standard caching
[[headers]]
  for = "/dashboard.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=3600"
